<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 搜索动效 Demo</title>
      <!-- The bundle is self-contained (an IIFE), so keep it classic-script compatible
           for file:// previews as well as normal HTTP hosting. -->
      <script src="./assets/index-Ar09Jhcb.js"></script>
      <link rel="stylesheet" href="./assets/index-CdB6gfmL.css">
  </head>
  <body>
    <div id="root"></div>
  <style id="auto-demo-styles">
    .auto-demo-badge {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 99999;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #fff;
      font-size: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
      padding: 8px 18px;
      border-radius: 20px;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
      box-shadow: 0 4px 16px rgba(0,0,0,0.24);
    }
    .auto-demo-badge.visible { opacity: 1; }
    .auto-demo-badge .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #4CAF50;
      animation: auto-demo-pulse 1.4s ease-in-out infinite;
    }
    @keyframes auto-demo-pulse {
      0%, 100% { opacity: 0.4; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .auto-demo-cursor {
      position: fixed;
      z-index: 100000;
      pointer-events: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid rgba(0, 122, 255, 0.7);
      background: rgba(0, 122, 255, 0.12);
      transform: translate(-50%, -50%) scale(0);
      transition: transform 0.15s cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow: 0 0 0 7px rgba(0, 122, 255, 0.08);
    }
    .auto-demo-cursor.active { transform: translate(-50%, -50%) scale(1); }
    .auto-demo-cursor.tap {
      border-color: rgba(0, 122, 255, 1);
      background: rgba(0, 122, 255, 0.24);
      box-shadow: 0 0 0 13px rgba(0, 122, 255, 0.16);
      transform: translate(-50%, -50%) scale(0.7);
    }
    .auto-demo-cursor.pause {
      border-color: rgba(255, 149, 0, 0.7);
      background: rgba(255, 149, 0, 0.1);
    }

    .auto-demo-tooltip {
      position: fixed;
      z-index: 100001;
      pointer-events: none;
      background: rgba(0, 0, 0, 0.82);
      color: #fff;
      font-size: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
      padding: 5px 12px;
      border-radius: 14px;
      white-space: nowrap;
      opacity: 0;
      transform: translate(-50%, -130%);
      transition: opacity 0.25s;
    }
    .auto-demo-tooltip.show { opacity: 1; }
  </style>

  <div class="auto-demo-cursor" id="autoDemoCursor"></div>
  <div class="auto-demo-tooltip" id="autoDemoTooltip">点击</div>
  <div class="auto-demo-badge" id="autoDemoBadge">
    <span class="dot"></span> 自动演示中
  </div>

  <script id="auto-demo-script">
    (function() {
      'use strict';

      var cursor = document.getElementById('autoDemoCursor');
      var tooltip = document.getElementById('autoDemoTooltip');
      var badge = document.getElementById('autoDemoBadge');
      var clicked = new WeakSet();
      var clickedTexts = {};
      var isRunning = false;
      var pausedByUser = false;
      var pauseUntil = 0;
      var currentLoop = 0;
      var maxLoops = 5;
      var clickIndex = 0;

      var CLICK_DELAY_MIN = 900;
      var CLICK_DELAY_MAX = 1800;
      var RESTART_DELAY = 4000;

      function moveCursorTo(el) {
        var rect = el.getBoundingClientRect();
        var cx = rect.left + rect.width / 2;
        var cy = rect.top + rect.height / 2;
        cursor.style.left = cx + 'px';
        cursor.style.top = cy + 'px';
        cursor.classList.add('active');
        tooltip.style.left = cx + 'px';
        tooltip.style.top = cy + 'px';
      }

      function tapAt(el, cb) {
        var rect = el.getBoundingClientRect();
        var cx = rect.left + rect.width / 2;
        var cy = rect.top + rect.height / 2;
        cursor.style.left = cx + 'px';
        cursor.style.top = cy + 'px';
        cursor.classList.add('active', 'tap');
        tooltip.style.left = cx + 'px';
        tooltip.style.top = cy + 'px';
        tooltip.classList.add('show');

        setTimeout(function() {
          try { el.click(); } catch(e) {}
          cursor.classList.remove('tap');
          tooltip.classList.remove('show');
          if (cb) setTimeout(cb, 300);
        }, 280);
      }

      function getClickableElements() {
        var all = document.querySelectorAll('div, button, a, span, img, input, textarea, p, h1, h2, h3, h4, h5, h6, li');
        var results = [];
        for (var i = 0; i < all.length; i++) {
          var el = all[i];
          var style = window.getComputedStyle(el);
          if (style.cursor === 'pointer' || el.tagName === 'BUTTON' || el.tagName === 'A' || el.getAttribute('role') === 'button') {
            var rect = el.getBoundingClientRect();
            if (rect.width > 10 && rect.height > 10 &&
                rect.top < window.innerHeight && rect.bottom > 0 &&
                rect.left < window.innerWidth && rect.right > 0 &&
                style.visibility !== 'hidden' && style.display !== 'none' && style.opacity !== '0') {
              results.push(el);
            }
          }
        }
        return results;
      }

      function randomDelay(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      function badgeShow() {
        badge.classList.add('visible');
      }
      function badgeHide() {
        badge.classList.remove('visible');
      }

      function handleUserInteraction(e) {
        if (!isRunning) return;
        var target = e.target;
        var tag = target.tagName;
        var isInteractive = (tag === 'BUTTON' || tag === 'A' || tag === 'INPUT' || tag === 'TEXTAREA' ||
                              target.getAttribute('role') === 'button' ||
                              window.getComputedStyle(target).cursor === 'pointer');
        if (isInteractive && !target.closest('#autoDemoCursor') && !target.closest('#autoDemoTooltip') && !target.closest('#autoDemoBadge')) {
          pausedByUser = true;
          pauseUntil = Date.now() + 4000;
          badge.textContent = '⏸ 已暂停（4秒后恢复）';
          cursor.classList.add('pause');
        }
      }

      document.addEventListener('click', handleUserInteraction, true);
      document.addEventListener('touchstart', handleUserInteraction, true);

      function runOneStep() {
        if (!isRunning) return;
        if (pausedByUser && Date.now() < pauseUntil) {
          setTimeout(runOneStep, 500);
          return;
        }
        if (pausedByUser && Date.now() >= pauseUntil) {
          pausedByUser = false;
          cursor.classList.remove('pause');
          badgeShow();
          badge.innerHTML = '<span class="dot"></span> 自动演示中';
        }

        var clickables = getClickableElements().filter(function(el) {
          return !clicked.has(el);
        });

        if (clickables.length === 0) {
          // Flow might be complete or transitioning - wait for new elements
          clickIndex++;
          if (clickIndex > 15) {
            // Stuck - restart the flow
            currentLoop++;
            if (currentLoop < maxLoops) {
              restartDemo();
              return;
            }
            badge.textContent = '✅ 演示完成';
            setTimeout(function() { badgeHide(); }, 2000);
            isRunning = false;
            return;
          }
          setTimeout(runOneStep, 800);
          return;
        }
        clickIndex = 0;
        currentLoop = 0;

        var el = clickables[0];
        var text = (el.textContent || '').trim().slice(0, 30);
        var key = text || el.className;
        if (clickedTexts[key] > 2) {
          clicked.add(el);
          setTimeout(runOneStep, 200);
          return;
        }
        clickedTexts[key] = (clickedTexts[key] || 0) + 1;

        moveCursorTo(el);
        var clickDelay = randomDelay(CLICK_DELAY_MIN, CLICK_DELAY_MAX);
        setTimeout(function() {
          tapAt(el, function() {
            clicked.add(el);
            setTimeout(runOneStep, randomDelay(600, 1100));
          });
        }, clickDelay);
      }

      function restartDemo() {
        clicked = new WeakSet();
        clickedTexts = {};
        clickIndex = 0;
        cursor.classList.remove('active', 'tap', 'pause');
        tooltip.classList.remove('show');
        badgeShow();
        badge.innerHTML = '<span class="dot"></span> 自动演示中';

        // Try to find and click a "back" or "reset" element
        var backBtns = document.querySelectorAll('[class*="back"], [class*="Back"], [class*="nav-icon"], [class*="close"], [class*="Close"]');
        for (var i = 0; i < backBtns.length; i++) {
          try {
            backBtns[i].click();
            break;
          } catch(e) {}
        }

        setTimeout(runOneStep, 2000);
      }

      function start() {
        if (isRunning) return;
        isRunning = true;
        currentLoop = 0;
        badgeShow();
        cursor.style.display = 'block';
        // Wait for React to mount
        waitForReact();
      }

      function waitForReact() {
        var root = document.getElementById('root');
        if (root && root.children.length > 0 && root.querySelector('div')) {
          setTimeout(runOneStep, 1500);
          return;
        }
        setTimeout(waitForReact, 300);
      }

      // Start
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() { setTimeout(start, 800); });
      } else {
        setTimeout(start, 800);
      }
    })();
  </script>
  </body>
</html>
